name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  command-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public SEAM command registry has no drift
        run: node tools/release/build-command-registry.cjs --check

  source-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm PHP platform
        run: |
          php -r "exit(PHP_VERSION_ID >= 80200 && PHP_VERSION_ID < 80500 ? 0 : 1);"
      - name: Install Kiwe AI Toolkit dependencies
        working-directory: kiwe-ai-toolkit
        run: npm ci --no-audit --no-fund
      - name: Verify SiteGraph-only fresh-install profile
        run: |
          php tools/release/test-sitegraph-only-fresh-install.php
          php tools/release/test-sitegraph-only-fresh-install.php existing
      - name: Verify automatic Bricks controls without runtime activation
        run: |
          php tools/release/test-bricks-surface-controls.php
          for theme in parent child renamed inactive missing; do
            php tools/release/test-bricks-auto-controls.php "$theme"
          done
      - name: Verify green source baseline
        run: node tools/release/verify-green-baseline.cjs
      - name: Verify lossless builder backup and credential isolation
        run: php tools/release/test-builder-snapshot-roundtrip.php
      - name: Verify fresh upload proof and clean-run credential isolation
        run: |
          php tools/release/test-package-proof-refresh.php
          php tools/release/test-clean-conversion-template-isolation.php
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install UI harness
        working-directory: tools/ui-contract
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run responsive accessibility and geometry contract
        run: node tools/ui-contract/run.cjs

  seam-render-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated compiler capture dependencies
        working-directory: packages/seam-capture
        run: npm ci --no-audit --no-fund
      - name: Run rendered capture and responsive geometry contract
        run: node packages/seam-capture/test/render-capture.cjs

  key-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WordPress-to-gateway security contract
        run: node tools/release/phonekey-whatsapp-contracts.cjs
      - name: Install the resource-capped gateway
        working-directory: services/key-gateway
        run: npm ci --no-audit --no-fund
      - name: Detect Baileys package, lockfile and upstream drift
        working-directory: services/key-gateway
        run: npm run check:compat
      - name: Test signed delivery, replay protection and fallback
        working-directory: services/key-gateway
        run: npm test
