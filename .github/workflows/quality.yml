name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm PHP platform
        run: php -r "exit(PHP_VERSION_ID >= 80200 && PHP_VERSION_ID < 80500 ? 0 : 1);"
      - name: Verify green source baseline
        run: node tools/release/verify-green-baseline.cjs

  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install UI harness
        working-directory: tools/ui-contract
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run responsive accessibility and geometry contract
        run: node tools/ui-contract/run.cjs

  seam-render-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated compiler capture dependencies
        working-directory: packages/seam-capture
        run: npm ci --no-audit --no-fund
      - name: Run rendered capture and responsive geometry contract
        run: node packages/seam-capture/test/render-capture.cjs
