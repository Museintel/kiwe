name: Build signed Kiwe MU release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release feed channel
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - stable
      profile:
        description: Package layout
        required: true
        default: bundled
        type: choice
        options:
          - bundled
          - core

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: openssl, sodium, zip
          tools: composer:2.10.2
      - name: Install Kiwe AI Toolkit dependencies
        working-directory: kiwe-ai-toolkit
        run: npm ci --no-audit --no-fund
      - name: Install locked MCP dependencies for comparison
        env:
          COMPOSER_ROOT_VERSION: dev-main
        run: composer install --working-dir=packages/kiwe-mcp-runtime --no-dev --prefer-dist --no-interaction --no-progress
      - name: Verify source baseline
        run: |
          npm ci --prefix tools/workspace-prototype --no-audit --no-fund
          node tools/release/verify-green-baseline.cjs
      - name: Require completed client feature coverage for stable launch
        if: inputs.channel == 'stable'
        run: node tools/workspace-prototype/audit-coverage.cjs "$RUNNER_TEMP/workspace-launch.json" --require-launch
      - name: Prepare physical Core profile
        if: inputs.profile == 'core'
        run: |
          node tools/release/build-core-app-profile.mjs --output-root="$RUNNER_TEMP/kiwe-core"
          signing_root="$RUNNER_TEMP/kiwe-core-signing"
          mkdir -p "$signing_root/tools/release" "$signing_root/wp-content"
          cp -R "$RUNNER_TEMP/kiwe-core/mu-plugins" "$signing_root/wp-content/"
          cp tools/release/build-signed-update.mjs "$signing_root/tools/release/"
          cp tools/release/kiwe-update-public-key.json "$signing_root/tools/release/"
      - name: Build signed release feed
        env:
          KIWE_UPDATE_ED25519_PRIVATE_PEM: ${{ secrets.KIWE_UPDATE_ED25519_PRIVATE_PEM }}
          KIWE_RELEASE_CHANNEL: ${{ inputs.channel }}
          KIWE_RELEASE_PROFILE: ${{ inputs.profile }}
        run: |
          case "$KIWE_RELEASE_PROFILE" in
            core)
              node "$RUNNER_TEMP/kiwe-core-signing/tools/release/build-signed-update.mjs" \
                --channel="$KIWE_RELEASE_CHANNEL" --archive="$RUNNER_TEMP/kiwe-core/kiwe-core.zip" \
                --output-root="$GITHUB_WORKSPACE/public/app.kiwelaunch.com/updates/kiwe/v1"
              ;;
            bundled)
              node tools/release/build-signed-update.mjs --channel="$KIWE_RELEASE_CHANNEL"
              ;;
            *) exit 2 ;;
          esac
      - name: Upload deployable feed
        uses: actions/upload-artifact@v4
        with:
          name: kiwe-${{ inputs.channel }}-signed-feed
          path: public/app.kiwelaunch.com/
          if-no-files-found: error
          retention-days: 30
