name: Build signed Kiwe MU release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release feed channel
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - stable
      profile:
        description: Package profile
        required: true
        default: bundled
        type: choice
        options:
          - bundled
          - core

permissions:
  contents: read

jobs:
  sign_private_candidate:
    if: github.repository == 'Museintel/kiwe' && github.ref == 'refs/heads/signing/rc502-membership-candidate' && inputs.channel == 'candidate' && inputs.profile == 'core' && !inputs.rollout_core
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Sign the two reviewed candidate digests
        env:
          KIWE_UPDATE_ED25519_PRIVATE_PEM: ${{ secrets.KIWE_UPDATE_ED25519_PRIVATE_PEM }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createPrivateKey, createPublicKey, sign } = require('node:crypto');
          const { mkdirSync, writeFileSync } = require('node:fs');
          const key = createPrivateKey(process.env.KIWE_UPDATE_ED25519_PRIVATE_PEM);
          assert.equal(key.asymmetricKeyType, 'ed25519');
          assert.equal(createPublicKey(key).export({type:'spki',format:'der'}).subarray(-32).toString('base64'), 'v6qwuL3+Zqx76G5A1MCqkvnzOM62fyXudc8OCgXqKzg=');
          const publishedAt = new Date().toISOString();
          const core = { ...{"schema":"kiwe.mu-release.v1","version":"8.0.0-rc.502","channel":"candidate","packageUrl":"https://app.kiwelaunch.com/updates/kiwe/v1/releases/8.0.0-rc.502/kiwe-mu-plugin.zip","sha256":"da1841f86a0d7ad3cd0399e2367d4ceb6563f8b50fb3b931f4ce2c6cc716e61f","bytes":2646234,"requiresPhp":"8.2","requiresWp":"7.1","packageManifestSha256":"2a0075a3ff1414a82fe804fa0ebfd21cf7962afad35b36bca2f1e6311f614775","keyId":"kiwe-release-2026-01"}, publishedAt };
          const store = { ...{"schema":"kiwe.app-release.v1","id":"store","version":"1.2.0-rc.4","channel":"candidate","coreApi":4,"requiresPhp":"8.2","requiresWp":"7.1","requiresWoo":"11.2","packageUrl":"https://app.kiwelaunch.com/apps/v1/releases/store/1.2.0-rc.4/kiwe-store.zip","sha256":"4a580e1fa3ad9f178237dd60cc35b4960e48c68946b2b5fec2baec00e5038e73","bytes":282776,"packageManifestSha256":"26d3297c017dce767ffdc64d45d260fae422ded01c0314ad890dff4de8f1afc6","keyId":"kiwe-release-2026-01"}, publishedAt: publishedAt.replace(/\.\d{3}Z$/, 'Z') };
          const corePayload = ["schema","version","channel","publishedAt","packageUrl","sha256","bytes","requiresPhp","requiresWp","packageManifestSha256","keyId"].map(field => core[field]).join('\n') + '\n';
          const storePayload = JSON.stringify(Object.fromEntries(Object.entries(store).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)));
          core.signature = sign(null, Buffer.from(corePayload), key).toString('base64');
          store.signature = sign(null, Buffer.from(storePayload), key).toString('base64');
          mkdirSync('candidate-manifests');
          writeFileSync('candidate-manifests/manifest.json', JSON.stringify(core, null, 2) + '\n');
          writeFileSync('candidate-manifests/release.json', JSON.stringify(store, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kiwe-rc502-detached-candidate-manifests
          path: candidate-manifests/
          if-no-files-found: error
          retention-days: 1
  release:
    if: github.ref != 'refs/heads/signing/rc502-membership-candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: openssl, zip
          tools: composer:2.10.2
      - name: Install Kiwe AI Toolkit dependencies
        working-directory: kiwe-ai-toolkit
        run: npm ci --no-audit --no-fund
      - name: Verify source baseline
        env:
          COMPOSER_ROOT_VERSION: dev-main
        run: |
          composer install --working-dir=packages/kiwe-mcp-runtime --no-dev --prefer-dist --no-interaction --no-progress
          npm ci --prefix tools/workspace-prototype --no-audit --no-fund
          node tools/release/verify-green-baseline.cjs
      - name: Require completed client feature coverage for stable launch
        if: inputs.channel == 'stable'
        run: node tools/workspace-prototype/audit-coverage.cjs "$RUNNER_TEMP/workspace-launch.json" --require-launch
      - name: Build signed release feed
        if: inputs.profile == 'bundled'
        env:
          KIWE_UPDATE_ED25519_PRIVATE_PEM: ${{ secrets.KIWE_UPDATE_ED25519_PRIVATE_PEM }}
        run: node tools/release/build-signed-update.mjs --channel=${{ inputs.channel }}
      - name: Upload deployable feed
        if: inputs.profile == 'bundled'
        uses: actions/upload-artifact@v4
        with:
          name: kiwe-${{ inputs.channel }}-signed-feed
          path: public/app.kiwelaunch.com/
          if-no-files-found: error
          retention-days: 30
      - name: Build Core package
        if: inputs.profile == 'core'
        run: node tools/release/build-core-app-profile.mjs --output-root="$RUNNER_TEMP/kiwe-core-profile"
      - name: Sign Core package
        if: inputs.profile == 'core'
        env:
          KIWE_RELEASE_CHANNEL: ${{ inputs.channel }}
          KIWE_UPDATE_ED25519_PRIVATE_PEM: ${{ secrets.KIWE_UPDATE_ED25519_PRIVATE_PEM }}
        run: |
          node tools/release/sign-core-app-profile.mjs \
            --profile-root="$RUNNER_TEMP/kiwe-core-profile" \
            --output-root="$RUNNER_TEMP/kiwe-core-signed" \
            --channel="$KIWE_RELEASE_CHANNEL"
      - name: Upload signed Core ZIP and manifest
        if: inputs.profile == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: kiwe-${{ inputs.channel }}-core-signed
          path: |
            ${{ runner.temp }}/kiwe-core-signed/releases/*/kiwe-mu-plugin.zip
            ${{ runner.temp }}/kiwe-core-signed/releases/*/manifest.json
          if-no-files-found: error
          retention-days: 30
